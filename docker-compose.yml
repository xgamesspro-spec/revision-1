services:
  classe:
    build: .
    container_name: classe-sio
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      # Code d'inscription permanent pour toute la classe (optionnel, sinon générer des codes dans « Modération »)
      CLASS_CODE: ""
      # Mets "1" aux deux lignes suivantes quand tu passes par le HTTPS (Caddy ci-dessous)
      COOKIE_SECURE: "0"
      TRUST_PROXY: "0"
      # Connexion avec Google (voir README « Connexion avec Google »)
      PUBLIC_URL: ""            # ex. https://classe.mondomaine.fr
      GOOGLE_CLIENT_ID: ""
      GOOGLE_CLIENT_SECRET: ""
      # Délai (jours) entre la fin de formation et la suppression du compte
      ACCOUNT_GRACE_DAYS: "60"
      # Pièces jointes : taille max d'un fichier et quota par élève et par jour (Mo)
      UPLOAD_MAX_MB: "10"
      UPLOAD_DAILY_MB: "100"
      # Antivirus ClamAV optionnel : décommente et lance « docker compose --profile antivirus up -d »
      # CLAMAV_HOST: "clamav"
      # Notifications push : contact de l'administrateur (exigé par la norme VAPID, RFC 8292)
      VAPID_SUBJECT: "mailto:ton.adresse@gmail.com"
      # Réunions : nombre max de participants par réunion (connexion directe entre navigateurs)
      MEETING_MAX: "10"
      # Serveur TURN optionnel pour les réseaux qui bloquent la visio (voir README)
      # TURN_URL: "turn:IP-DU-SERVEUR:3478"
      # TURN_USER: "classe"
      # TURN_PASS: "change-moi"
    volumes:
      - ./data:/data

  # HTTPS : docker compose --profile https up -d
  caddy:
    image: caddy:2-alpine
    profiles: ["https"]
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_ADDRESS: "localhost" # remplace par ton domaine ou l'IP du serveur
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on: [classe]

  # Antivirus des pièces jointes (optionnel, ~1 Go de RAM) : docker compose --profile antivirus up -d
  clamav:
    image: clamav/clamav:stable
    profiles: ["antivirus"]
    restart: unless-stopped

  # Relais TURN (optionnel) : docker compose --profile turn up -d
  turn:
    image: coturn/coturn:latest
    profiles: ["turn"]
    restart: unless-stopped
    network_mode: host
    command: >
      -n --lt-cred-mech --fingerprint
      --user=classe:change-moi --realm=classe-sio
      --listening-port=3478 --min-port=49160 --max-port=49200

volumes:
  caddy_data:
